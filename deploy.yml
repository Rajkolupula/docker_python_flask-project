apiVersion: apps/v1
kind: Deployment
metadata:
  name: python1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python1
  template:
    metadata:
      labels:
        app: python1
    spec:
      containers:
        - name: python-container
          image: rajukolupula/python1:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: python1-service
spec:
  selector:
    app: python1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
